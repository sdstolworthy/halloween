[project]
name = "witch-bridge"
version = "0.1.0"
description = "MQTT <-> mpv bridge for the Halloween witch projector"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.0,<3"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["witch_bridge"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
