# Mosquitto runs with hostNetwork on the k3s control-plane node.
mqtt_host: 10.0.0.84
mqtt_port: 1883
mqtt_username: witch-projector
mqtt_password: "{{ vault_mqtt_password }}"

witch_home: /opt/witch
witch_source: "{{ playbook_dir }}/.."
witch_videos_dir: "{{ witch_home }}/videos"
# Each name becomes a "Play <name>" button in Home Assistant, played from <name>.mp4. Random scare picks among them.
witch_videos: [witch1, witch2, witch3, ghost]
# Loops whenever no scare is playing (at boot, after a scare ends, after Stop). It gets no button.
witch_idle_video: happy
# install.sh sets WITCH_VIDEO_SRC_DIR from its argument; passing it through the environment avoids -e quoting
# problems with paths that contain spaces.
witch_video_src_dir: "{{ lookup('ansible.builtin.env', 'WITCH_VIDEO_SRC_DIR') }}"

# Where the sound goes: hdmi (HDMI 0, through the projector), jack (the Pi's 3.5mm socket) or bluetooth (the
# speaker paired with pair-speaker.sh). Override per run with ./install.sh ~ -e witch_audio_output=bluetooth.
witch_audio_output: hdmi
witch_audio_devices:
  hdmi: alsa/default:CARD=vc4hdmi0
  jack: alsa/default:CARD=Headphones
  # BlueALSA's default PCM is the most recently connected Bluetooth device, so this needs no address.
  bluetooth: alsa/bluealsa
# The paired speaker's address (AA:BB:CC:DD:EE:FF). When set, a timer reconnects it every 30 s if it drops, e.g.
# after the speaker goes to sleep and is switched back on.
witch_bluetooth_speaker: ""
