- name: Configure the witch projector
  hosts: all
  become: true
  tasks:
    - name: Check the audio settings
      ansible.builtin.assert:
        that:
          - witch_audio_output in witch_audio_devices
          - witch_bluetooth_speaker == '' or witch_bluetooth_speaker is match('^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$')
        fail_msg: >-
          witch_audio_output must be one of {{ witch_audio_devices | list | join(', ') }}, and
          witch_bluetooth_speaker empty or an address like AA:BB:CC:DD:EE:FF.
        quiet: true

    # BlueALSA rather than PipeWire: there is no desktop login session for a per-user sound server, and BlueALSA
    # exposes the speaker as a plain ALSA device that the witch user (in the audio group) can open.
    - name: Install mpv, venv support and Bluetooth audio
      ansible.builtin.apt:
        name: [mpv, python3-venv, bluez, bluez-alsa-utils, libasound2-plugin-bluez]
        update_cache: true
        cache_valid_time: 3600

    - name: Create the witch service user
      ansible.builtin.user:
        name: witch
        system: true
        home: "{{ witch_home }}"
        create_home: false
        shell: /usr/sbin/nologin
        groups: [video, render, audio]
        append: true

    - name: Create the install and config directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ witch_home }}", group: root, mode: "0755" }
        - { path: "{{ witch_home }}/src", group: root, mode: "0755" }
        - { path: "{{ witch_videos_dir }}", group: root, mode: "0755" }
        - { path: /etc/witch, group: witch, mode: "0750" }

    - name: Copy the bridge source
      ansible.builtin.copy:
        src: "{{ witch_source }}/{{ item }}"
        dest: "{{ witch_home }}/src/"
        mode: preserve
      loop: [witch_bridge, pyproject.toml]
      register: bridge_source

    - name: Create the virtualenv
      ansible.builtin.command: python3 -m venv {{ witch_home }}/venv
      args:
        creates: "{{ witch_home }}/venv/bin/python"
      register: venv

    # The package version doesn't change between edits, so a plain upgrade would skip changed source.
    - name: Install the bridge into the virtualenv
      ansible.builtin.command: "{{ witch_home }}/venv/bin/pip install --upgrade --force-reinstall {{ witch_home }}/src"
      changed_when: true
      when: bridge_source is changed or venv is changed
      notify: Restart witch-bridge

    - name: Look for the videos
      ansible.builtin.stat:
        path: "{{ witch_video_src_dir }}/{{ item }}.mp4"
      loop: "{{ witch_videos + [witch_idle_video] }}"
      register: video_sources

    - name: Copy the videos
      ansible.builtin.copy:
        src: "{{ item.stat.path }}"
        dest: "{{ witch_videos_dir }}/{{ item.item }}.mp4"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ video_sources.results | selectattr('stat.exists') }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Note which videos are installed
      ansible.builtin.set_fact:
        installed_videos: "{{ video_sources.results | selectattr('stat.exists') | map(attribute='item') | list }}"
        missing_videos: "{{ video_sources.results | rejectattr('stat.exists') | map(attribute='item') }}"

    - name: Find videos that are no longer listed
      ansible.builtin.find:
        paths: "{{ witch_videos_dir }}"
        patterns: "*.mp4"
      register: video_files

    - name: Remove unlisted videos
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ video_files.files | map(attribute='path') }}"
      when: (item | basename | splitext | first) not in installed_videos

    - name: Remove the single video from before there was a list
      ansible.builtin.file:
        path: "{{ witch_home }}/witch.mp4"
        state: absent

    - name: Write the bridge environment file
      ansible.builtin.template:
        src: bridge.env.j2
        dest: /etc/witch/bridge.env
        owner: root
        group: witch
        mode: "0640"
      no_log: true
      notify: Restart witch-bridge

    # Changing the boot target must not lock us out: an sshd that was only started by hand (or by the desktop)
    # would not come back after a reboot to the console.
    - name: Check whether SSH is running
      ansible.builtin.systemd:
        name: ssh.service
      register: ssh_service
      failed_when: false
      tags: [systemd]

    - name: Keep SSH enabled across reboots
      ansible.builtin.systemd:
        name: ssh.service
        enabled: true
      when: ssh_service.status.ActiveState | default('') == 'active'
      tags: [systemd]

    # A desktop session's compositor holds DRM master on the HDMI output, so mpv can't draw. Desktop images boot
    # to the console instead; `systemctl set-default graphical.target` brings the desktop back.
    - name: Read the default boot target
      ansible.builtin.command: systemctl get-default
      register: boot_target
      changed_when: false
      tags: [systemd]

    - name: Boot to the console instead of the desktop
      ansible.builtin.command: systemctl set-default multi-user.target
      when: boot_target.stdout != 'multi-user.target'
      changed_when: true
      tags: [systemd]

    - name: Check for a running display manager
      ansible.builtin.systemd:
        name: display-manager.service
      register: display_manager
      failed_when: false
      tags: [systemd]

    - name: Stop the display manager
      ansible.builtin.systemd:
        name: display-manager.service
        state: stopped
      when: display_manager.status.ActiveState | default('') == 'active'
      notify: Restart witch-mpv
      tags: [systemd]

    - name: Write the mpv environment file
      ansible.builtin.template:
        src: mpv.env.j2
        dest: /etc/witch/mpv.env
        owner: root
        group: witch
        mode: "0640"
      notify: Restart witch-mpv

    - name: Write the Bluetooth speaker environment file
      ansible.builtin.template:
        src: speaker.env.j2
        dest: /etc/witch/speaker.env
        owner: root
        group: root
        mode: "0644"

    - name: Start Bluetooth and BlueALSA
      ansible.builtin.systemd:
        name: "{{ item }}.service"
        enabled: true
        state: started
      loop: [bluetooth, bluealsa]
      tags: [systemd]

    - name: Install the mpv and speaker units
      ansible.builtin.copy:
        src: "{{ witch_source }}/systemd/{{ item }}"
        dest: /etc/systemd/system/{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop: [witch-mpv.service, witch-speaker-reconnect.service, witch-speaker-reconnect.timer]
      register: mpv_units
      notify: Restart witch-mpv
      tags: [systemd]

    - name: Install the bridge unit
      ansible.builtin.copy:
        src: "{{ witch_source }}/systemd/witch-bridge.service"
        dest: /etc/systemd/system/witch-bridge.service
        owner: root
        group: root
        mode: "0644"
      register: bridge_unit
      notify: Restart witch-bridge
      tags: [systemd]

    - name: Enable and start the services
      ansible.builtin.systemd:
        name: "{{ item }}.service"
        enabled: true
        state: started
        daemon_reload: "{{ mpv_units is changed or bridge_unit is changed }}"
      loop: [witch-mpv, witch-bridge]
      tags: [systemd]

    - name: Reconnect the speaker when one is set
      ansible.builtin.systemd:
        name: witch-speaker-reconnect.timer
        enabled: "{{ witch_bluetooth_speaker != '' }}"
        state: "{{ 'started' if witch_bluetooth_speaker != '' else 'stopped' }}"
      tags: [systemd]

    - name: Apply pending restarts before verifying
      ansible.builtin.meta: flush_handlers

    - name: Wait for mpv's control socket
      ansible.builtin.wait_for:
        path: /run/witch/mpv.sock
        timeout: 30
      tags: [systemd]

    - name: Gather service state
      ansible.builtin.service_facts:
      tags: [systemd]

    - name: Check both services are running
      ansible.builtin.assert:
        that: ansible_facts.services[item ~ '.service'].state == 'running'
        fail_msg: "{{ item }} is not running; see journalctl -u {{ item }}"
        quiet: true
      loop: [witch-mpv, witch-bridge]
      tags: [systemd]

    - name: Warn about missing videos
      ansible.builtin.debug:
        msg: >-
          No {{ missing_videos | map('regex_replace', '$', '.mp4') | join(', ') }} in {{ witch_video_src_dir }};
          those buttons are left out. Copy them there and rerun install.sh to add them.
      when: missing_videos | length > 0

  handlers:
    - name: Restart witch-mpv
      ansible.builtin.systemd:
        name: witch-mpv.service
        state: restarted
        daemon_reload: true

    - name: Restart witch-bridge
      ansible.builtin.systemd:
        name: witch-bridge.service
        state: restarted
        daemon_reload: true
