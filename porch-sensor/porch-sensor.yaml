esphome:
  name: porch-sensor
  friendly_name: Porch Sensor
  min_version: 2026.9.0

esp32:
  board: esp32dev

logger:
  baud_rate: 115200
  logs:
    # Distance publishes 10 times a second; at DEBUG it drowns out the Visitor transitions.
    sensor: INFO

# Rebooting after the default 15 min without Wi-Fi helps the sensor recover. Home Assistant being down is not a
# board fault, so the API must not reboot it.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Porch-Sensor
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

# Alongside the native API, only to feed the eyes (halloween/eyes): HA already gets every entity over the API,
# so MQTT discovery is off to avoid duplicates. A broker outage is not a board fault, so it never reboots.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  reboot_timeout: 0s
  # Logs stay on the serial console and API; don't stream them to the broker.
  log_topic: null

web_server:
  port: 80
  ota: false
  auth:
    type: digest
    username: admin
    password: !secret web_password

packages:
  porch_sensor: !include sensor.yaml

# The eyes track the visitor from the ~10 Hz internal distance (after the "nobody" mapping and median), so
# it goes out on its own topic as plain metres. The package stays MQTT-free for devices that include it.
sensor:
  - id: !extend porch_distance_raw
    on_value:
      - if:
          condition: mqtt.connected
          then:
            - mqtt.publish:
                topic: halloween/porch/distance
                payload: !lambda 'return str_sprintf("%.2f", x);'
                qos: 0
                retain: false
