substitutions:
  servo_pin: GPIO25
  # Every move slams to a sweep end, alternating ends (see shaker::plan_move): full deflection each
  # stroke. The dwell is how long a stroke gets before the reversal; the MG90S needs ~330 ms for the
  # full 180 under load, so a shorter dwell reverses mid-travel and shrinks the arc instead of speeding
  # it up. If the servo buzzes/grinds at the ends, back the sweep off to 5-175.
  sweep_min_deg: "0"
  sweep_max_deg: "180"
  dwell_min_ms: "700"
  dwell_max_ms: "700"

esphome:
  name: skeleton-shaker
  friendly_name: Skeleton Shaker
  min_version: 2026.9.0
  includes:
    - shaker.h
  on_boot:
    # A template binary sensor with no lambda never publishes on its own, so Dancing would read "unknown".
    priority: 600
    then:
      - binary_sensor.template.publish:
          id: dancing
          state: false

esp32:
  board: esp32dev

logger:
  baud_rate: 115200

# The dance is triggered over the network, so a Wi-Fi reboot after the default 15 min helps it recover. Home
# Assistant being down is not a board fault, so the API must not reboot it.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Skeleton-Shaker
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s
  actions:
    - action: dance
      then:
        - script.execute: request_dance

ota:
  - platform: esphome
    encryption:

web_server:
  port: 80
  ota: false
  auth:
    type: digest
    username: admin
    password: !secret web_password

.tuning: &tuning
  platform: template
  optimistic: true
  restore_value: true
  entity_category: config
  mode: box

globals:
  - id: dance_started_at
    type: uint32_t
  - id: dwell_ms
    type: uint32_t

output:
  - platform: ledc
    id: servo_pwm
    pin: ${servo_pin}
    frequency: 50Hz

# With restore off, the servo's setup detaches it (duty 0), so it boots limp instead of jumping to centre.
servo:
  - id: shaker_servo
    output: servo_pwm
    min_level: 2.5%
    # Midway between 500 and 2400 us, so both halves of the -1..1 range scale alike and (deg - 90) / 90 is exact.
    idle_level: 7.25%
    max_level: 12.0%
    transition_length: 0s
    auto_detach_time: 0s

button:
  - platform: template
    name: Dance
    on_press:
      - script.execute: request_dance
  - platform: template
    name: Stop
    on_press:
      - script.stop: dance
      # Dancing stays on through the final re-centre, so this covers every moment the servo is attached. While
      # idle or cooling down it is already detached at centre, and re-centring would only twitch it.
      - if:
          condition:
            binary_sensor.is_on: dancing
          then:
            - script.execute: servo_rest
      - binary_sensor.template.publish:
          id: dancing
          state: false

binary_sensor:
  - platform: template
    id: dancing
    name: Dancing

number:
  - <<: *tuning
    id: dance_length_s
    name: Dance length
    unit_of_measurement: s
    min_value: 3
    max_value: 20
    step: 0.5
    initial_value: 8
  - <<: *tuning
    id: cooldown_s
    name: Cooldown
    unit_of_measurement: s
    min_value: 0
    max_value: 60
    step: 0.5
    initial_value: 4

script:
  # Checking first keeps dropped requests at INFO; mode: single on its own logs each one as a warning.
  - id: request_dance
    then:
      - if:
          condition:
            script.is_running: dance
          then:
            - logger.log:
                level: INFO
                format: "Dance ignored (dancing or cooling down)"
          else:
            - script.execute: dance

  # Centre, give the horn time to get there, then stop pulsing so the servo doesn't buzz or draw holding current.
  - id: servo_rest
    mode: restart
    then:
      - servo.write:
          id: shaker_servo
          level: 0
      - delay: 300ms
      - servo.detach: shaker_servo

  # mode: single plus the cooldown living inside the script is what makes overlapping requests (during the dance
  # or the cooldown) no-ops instead of stacked dances.
  - id: dance
    mode: single
    then:
      # A Stop just before this request leaves servo_rest pending; its detach would go limp mid-dance.
      - script.stop: servo_rest
      - lambda: |-
          id(dance_started_at) = millis();
          ESP_LOGI("shaker", "Dancing for %.1f s", id(dance_length_s).state);
      - binary_sensor.template.publish:
          id: dancing
          state: true
      - while:
          condition:
            lambda: return !shaker::elapsed(millis(), id(dance_started_at), uint32_t(id(dance_length_s).state * 1000));
          then:
            - lambda: |-
                static bool go_high;
                go_high = !go_high;
                auto move = shaker::plan_move({${sweep_min_deg}, ${sweep_max_deg}}, {${dwell_min_ms}, ${dwell_max_ms}},
                                              go_high, [] { return random_uint32(); });
                id(shaker_servo).write(move.level);
                id(dwell_ms) = move.dwell_ms;
                ESP_LOGD("shaker", "Move to level %.2f, dwell %" PRIu32 " ms", move.level, move.dwell_ms);
            - delay: !lambda return id(dwell_ms);
      - script.execute: servo_rest
      - script.wait: servo_rest
      - binary_sensor.template.publish:
          id: dancing
          state: false
      - logger.log:
          level: INFO
          format: "Dance done, cooling down"
      - delay: !lambda return uint32_t(id(cooldown_s).state * 1000);
      - logger.log:
          level: INFO
          format: "Ready for the next victim"
