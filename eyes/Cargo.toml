[workspace]
resolver = "2"
members = ["eyes-core", "eyes-render", "eyes-emulator", "eyes-web"]
# The firmware builds only under the ESP-IDF toolchain (`cargo +esp`), so it is its own workspace and
# `cargo test` here never tries to compile it.
exclude = ["firmware"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
embedded-graphics = "0.8.2"
libm = "0.2"
log = "0.4"
serde_json = { version = "1.0.150", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
