server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The page, script and wasm must always match each other: revalidate on every load so a redeploy
    # never pairs a cached main.js with a new eyes_web.wasm (nginx answers 304 when nothing changed).
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
