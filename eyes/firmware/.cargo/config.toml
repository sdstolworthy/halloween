[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
# --partition-table is required, or espflash writes its own single-app table. Run from firmware/.
runner = "espflash flash --monitor --partition-table partitions.csv"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
ESP_IDF_VERSION = "v5.3.3"
ESP_IDF_SDKCONFIG_DEFAULTS = { value = "sdkconfig.defaults", relative = true }
# Copy partitions.csv into the generated ESP-IDF project; without it cmake silently uses the default table.
ESP_IDF_GLOB_PARTITIONS_BASE = { value = ".", relative = true }
ESP_IDF_GLOB_PARTITIONS_CSV = "partitions.csv"
# Read package.metadata (the HUB75 components) from this crate.
ESP_IDF_SYS_ROOT_CRATE = "eyes-firmware"
